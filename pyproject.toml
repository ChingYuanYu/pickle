[project]
name = "pbcoach"
version = "0.1.0"
description = "Pickleball match analysis: angle-robust court calibration and player tracking in court meters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
]

[project.optional-dependencies]
# YOLO person detector for real footage (recommended)
yolo = ["ultralytics"]

[project.scripts]
pbcoach = "pbcoach.pipeline:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
